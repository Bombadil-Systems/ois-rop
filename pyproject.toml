[project]
name = "ois-rop"
version = "1.0.0"
description = "Offset Instruction Set — expresses payloads as coordinate references into signed system binaries"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Chris Aziz", email = "chris@bombadil.systems"}]

dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ois = "ois_rop.compiler:main"

[project.urls]
Homepage = "https://github.com/Bombadil-Systems/ois-rop"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ois_rop*"]
